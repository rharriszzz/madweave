name: Planar weaving research suite
on:
  push:
    branches: [research/planar-weave-experiments]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planar-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install research browser and PNG decoder
        run: |
          npm install --no-save playwright@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Run complete planar research suite
        run: python3 research/run-tests.py
      - name: Upload logs, measurements, SVGs, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planar-weave-research-results
          path: research/output/
          if-no-files-found: warn
