name: Original editor hover and paint
on:
  workflow_dispatch:
jobs:
  hover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/madweave-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/editor.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Exercise actual hover and click
        run: node research/editor-hover-paint.cjs
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-editor-hover-paint
          path: research/output/hover/
          if-no-files-found: ignore
