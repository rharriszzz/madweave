name: Test and publish MadWeave
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      # Keep this image aligned with package-lock.json and requirements-dev.txt.
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MADWEAVE_BROWSER: ${{ matrix.browser }}
      MADWEAVE_STAGE2_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: node --check madweave.js && node --check project.js && node --check editor.js && node --check corner-editor.js && node --check corner-model.mjs && node --check corner-runtime.js
      - name: Verify generated corner assets
        run: |
          python scripts/build_corner_runtime.py
          python research/build-corner-package.py
          git diff --exit-code -- corner-runtime.js research/corner-prototype/bundle.mjs
      - run: node --test tests/math.test.cjs
      - run: npm run test:corner
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - run: npm run test:corner:browser
      - uses: actions/upload-pages-artifact@v5
        if: matrix.browser == 'chromium'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
