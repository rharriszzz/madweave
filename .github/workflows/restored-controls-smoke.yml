name: Restored original controls smoke tests
on:
  push:
    branches: [master]
    paths:
      - 'madweave.js'
      - 'corner-editor.js'
      - 'corner-model.mjs'
      - 'corner-runtime.js'
      - 'editor.js'
      - 'editor.html'
      - 'madweave.svg'
      - 'tests/test_browser.py'
      - '.github/workflows/restored-controls-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restored-controls:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MADWEAVE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare container user and checked-out workspace
        run: |
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Exercise restored controls, palettes, persistence, size, patterns, and offline export
        run: |
          python -m unittest discover -s tests -p test_browser.py -v \
            -k original_layout_and_bottom_view_controls \
            -k corner_angles_hexweave_and_keyboard_transactions \
            -k every_size_pattern_color_count_and_spacing \
            -k saved_visibility_spacing_and_controls_survive_rebuild \
            -k palette_sliders_change_color_and_opacity \
            -k editable_project_round_trip_offline_and_resave
