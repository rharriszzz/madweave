name: Planar weaving browser SVG validation
on:
  push:
    branches: [research/planar-weave-experiments]
  workflow_dispatch:
jobs:
  svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/madweave-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/research/planar-svg-diagnostic.html > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Render and verify SVG
        run: node research/browser-svg-check.cjs
      - name: Upload SVGs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planar-svg-diagnostic-renders
          path: research/output/
          if-no-files-found: ignore
