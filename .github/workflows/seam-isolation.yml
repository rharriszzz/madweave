name: SVG seam reduction and alpha model
on:
  push:
    branches: [research/svg-seam-rendering]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install both rendering engines
        run: |
          npm install --no-save playwright@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium firefox
      - name: Serve isolated fixtures
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/madweave-seam-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/editor.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node --check research/seam-isolation-check.cjs
      - name: Reduce SVG and check model in Chromium
        run: MADWEAVE_RESEARCH_BROWSER=chromium node research/seam-isolation-check.cjs
      - name: Reduce SVG and check model in Firefox
        run: MADWEAVE_RESEARCH_BROWSER=firefox node research/seam-isolation-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-seam-reduction
          path: research/output/seam-isolation/
          if-no-files-found: warn
