name: SVG seam diagnosis and fix
on:
  push:
    branches: [master, research/svg-seam-rendering]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      MADWEAVE_RESEARCH_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install rendering engine
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve isolated fixtures
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/madweave-seam-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/editor.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Check original reduction and alpha model
        if: matrix.browser != 'webkit'
        run: node research/seam-isolation-check.cjs
      - name: Check corrected fixture, full weave, and static SVG image
        run: node research/seam-fix-check.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: svg-seams-${{ matrix.browser }}
          path: |
            research/output/seam-isolation/
            research/output/seam-fix/
          if-no-files-found: warn
